<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="backpackTitle backpackDesc">
  <title id="backpackTitle">リュックサック</title>
  <desc id="backpackDesc">トップハンドルとバックルが付いたリュックサック</desc>
  <g fill="none" stroke="var(--bag-ink, #3f3228)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- shoulder straps (behind the body, peeking out at both sides) -->
    <path d="M44 48C20 58 14 82 26 102" stroke-width="8" stroke="var(--bag-shade, #b5792f)"/>
    <path d="M84 48c24 10 30 34 18 54" stroke-width="8" stroke="var(--bag-shade, #b5792f)"/>
    <path d="M44 48C20 58 14 82 26 102M84 48c24 10 30 34 18 54"/>
    <!-- grab handle -->
    <path d="M54 40c0-7 4-11 10-11s10 4 10 11" stroke-width="4"/>
    <!-- body -->
    <path d="M28 68c0-16 16-30 36-30s36 14 36 30v28a14 14 0 0 1-14 14H42a14 14 0 0 1-14-14z" fill="var(--bag-base, #e0a34f)"/>
    <!-- top flap -->
    <path d="M28 68c0-16 16-30 36-30s36 14 36 30v4a10 10 0 0 1-10 10H38a10 10 0 0 1-10-10z" fill="var(--bag-shade, #cf8f3c)"/>
    <!-- flap buckles -->
    <path d="M52 80v10M76 80v10" stroke-width="5"/>
    <rect x="47" y="86" width="10" height="9" rx="2.5" fill="var(--bag-metal, #f4efe4)" stroke-width="2.6"/>
    <rect x="71" y="86" width="10" height="9" rx="2.5" fill="var(--bag-metal, #f4efe4)" stroke-width="2.6"/>
    <!-- front pocket -->
    <path d="M44 110v-6a6 6 0 0 1 6-6h28a6 6 0 0 1 6 6v6" fill="var(--bag-accent, #f6e2bb)"/>
    <path d="M48 98h32" stroke-width="2.4" opacity=".6"/>
  </g>
</svg>
