<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 280" width="180" height="280" role="img" aria-labelledby="suitcaseTitle suitcaseDesc">
  <title id="suitcaseTitle">キャリーケース</title>
  <desc id="suitcaseDesc">幅45cm・高さ70cm相当の中型ハードキャリーケース。伸縮ハンドル、4輪キャスター、TSAロック付き</desc>
  <g fill="none" stroke="var(--bag-ink, #3f3228)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- retracted telescoping handle -->
    <path d="M66 12v22M114 12v22" stroke-width="7" stroke="var(--bag-metal, #b9c4cb)"/>
    <path d="M66 12v22M114 12v22" stroke-width="3"/>
    <rect x="56" y="4" width="68" height="15" rx="7.5" fill="var(--bag-metal, #cdd6dc)"/>
    <path d="M62 11.5h56" stroke-width="2.6" opacity=".55"/>

    <!-- shell -->
    <rect x="8" y="26" width="164" height="220" rx="28" fill="var(--bag-base, #4e9fb0)"/>
    <!-- lid side panel -->
    <path d="M140 26h4a28 28 0 0 1 28 28v164a28 28 0 0 1-28 28h-4z" fill="var(--bag-shade, #3c8494)" stroke="none"/>
    <path d="M140 27v218" stroke-width="3.4"/>
    <!-- zipper dots along the split -->
    <path d="M140 60v2M140 80v2M140 100v2M140 120v2M140 140v2M140 160v2M140 180v2M140 200v2" stroke-width="3" opacity=".6"/>
    <!-- shell ribs -->
    <path d="M36 54v190M62 54v190M88 54v190M114 54v190" stroke-width="3" opacity=".45"/>
    <!-- corner protectors -->
    <path d="M8 62v-8a28 28 0 0 1 28-28h10" stroke-width="7" stroke="var(--bag-shade, #3c8494)"/>
    <path d="M8 210v8a28 28 0 0 0 28 28h10" stroke-width="7" stroke="var(--bag-shade, #3c8494)"/>
    <!-- side carry handle -->
    <path d="M14 112H8a7 7 0 0 0-7 7v22a7 7 0 0 0 7 7h6" fill="var(--bag-metal, #cdd6dc)" stroke-width="3.4"/>
    <!-- TSA lock -->
    <rect x="59" y="38" width="30" height="17" rx="5" fill="var(--bag-metal, #cdd6dc)" stroke-width="3.2"/>
    <circle cx="74" cy="46.5" r="3" fill="var(--bag-ink, #3f3228)" stroke="none"/>
    <!-- luggage tag -->
    <path d="M114 30l12 8" stroke-width="2.6"/>
    <rect x="124" y="36" width="30" height="20" rx="5" fill="var(--bag-accent, #f2c14e)" stroke-width="3.2"/>
    <path d="M131 44h16M131 50h11" stroke-width="2.4" opacity=".6"/>
    <!-- rear casters (behind) -->
    <circle cx="62" cy="254" r="9" fill="var(--bag-metal, #b9c4cb)" stroke-width="3.2"/>
    <circle cx="118" cy="254" r="9" fill="var(--bag-metal, #b9c4cb)" stroke-width="3.2"/>
    <!-- front spinner casters -->
    <path d="M28 246h20v8H28zM132 246h20v8h-20z" fill="var(--bag-metal, #cdd6dc)" stroke-width="3.2"/>
    <circle cx="38" cy="262" r="13" fill="var(--bag-metal, #cdd6dc)"/>
    <circle cx="142" cy="262" r="13" fill="var(--bag-metal, #cdd6dc)"/>
    <circle cx="38" cy="262" r="4.5" fill="var(--bag-ink, #3f3228)" stroke="none"/>
    <circle cx="142" cy="262" r="4.5" fill="var(--bag-ink, #3f3228)" stroke="none"/>
  </g>
</svg>
