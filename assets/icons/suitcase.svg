<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="suitcaseTitle suitcaseDesc">
  <title id="suitcaseTitle">キャリーケース</title>
  <desc id="suitcaseDesc">伸縮ハンドルとキャスター付きのハードキャリーケース</desc>
  <g fill="none" stroke="var(--bag-ink, #3f3228)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- telescoping handle -->
    <path d="M48 40V24a3 3 0 0 1 3-3h26a3 3 0 0 1 3 3v16" fill="var(--bag-metal, #cdd6dc)"/>
    <path d="M56 21.5v18M72 21.5v18" stroke-width="2.4"/>
    <!-- luggage tag -->
    <path d="M80 27h9a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4h-9" fill="var(--bag-accent, #f2c14e)" stroke-width="2.6"/>
    <!-- shell -->
    <rect x="24" y="38" width="80" height="72" rx="13" fill="var(--bag-base, #4e9fb0)"/>
    <!-- lid split / side panel shading -->
    <path d="M89 39.5c3.3 3 4.6 7.6 4.6 13.4v42.6c0 5.8-1.3 10.4-4.6 13.4" fill="var(--bag-shade, #3c8494)" stroke="none"/>
    <path d="M86 40v68" stroke-width="2.6"/>
    <!-- ribs -->
    <path d="M40 52v44M52 52v44M64 52v44M76 52v44" stroke-width="2.4" opacity=".65"/>
    <!-- latch -->
    <rect x="18" y="62" width="12" height="16" rx="4" fill="var(--bag-accent, #f2c14e)" stroke-width="2.6"/>
    <!-- corner guards -->
    <path d="M24 96v1a13 13 0 0 0 13 13h4" stroke-width="5" stroke="var(--bag-shade, #3c8494)"/>
    <path d="M104 96v1a13 13 0 0 1-13 13h-4" stroke-width="5" stroke="var(--bag-shade, #3c8494)"/>
    <!-- wheels -->
    <circle cx="40" cy="113" r="6" fill="var(--bag-metal, #cdd6dc)"/>
    <circle cx="88" cy="113" r="6" fill="var(--bag-metal, #cdd6dc)"/>
  </g>
</svg>
