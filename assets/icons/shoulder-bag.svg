<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 168" width="120" height="168" role="img" aria-labelledby="shoulderTitle shoulderDesc">
  <title id="shoulderTitle">ショルダーバッグ</title>
  <desc id="shoulderDesc">幅27cm・高さ19cm相当の小ぶりなショルダーバッグ。長さ調整金具付きのストラップとフラップ</desc>
  <g fill="none" stroke="var(--bag-ink, #3f3228)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- long shoulder strap -->
    <path d="M18 88C12 44 38 14 66 16c26 2 40 28 36 72" stroke-width="8" stroke="var(--bag-shade, #a8543f)"/>
    <path d="M18 88C12 44 38 14 66 16c26 2 40 28 36 72" stroke-width="3.4"/>
    <!-- length adjuster -->
    <rect x="92" y="48" width="16" height="20" rx="4" transform="rotate(8 100 58)" fill="var(--bag-metal, #f4efe4)" stroke-width="3"/>
    <path d="M100 52v12" transform="rotate(8 100 58)" stroke-width="2.6" opacity=".6"/>

    <!-- body -->
    <path d="M6 84h108v58a18 18 0 0 1-18 18H24a18 18 0 0 1-18-18z" fill="var(--bag-base, #c9705d)"/>
    <!-- side gusset -->
    <path d="M98 84h16v58a18 18 0 0 1-18 18h-8a18 18 0 0 0 10-18z" fill="var(--bag-shade, #b45f4d)" stroke="none"/>
    <path d="M98 85v57" stroke-width="3" opacity=".7"/>
    <!-- flap -->
    <path d="M6 84h108v32a14 14 0 0 1-14 14H20a14 14 0 0 1-14-14z" fill="var(--bag-shade, #b45f4d)"/>
    <path d="M14 122h92" stroke-width="2.6" stroke-dasharray="1 6" opacity=".6"/>
    <!-- clasp -->
    <path d="M60 126v10" stroke-width="6"/>
    <rect x="50" y="130" width="20" height="14" rx="4" fill="var(--bag-metal, #f4efe4)" stroke-width="3"/>
    <path d="M56 137h8" stroke-width="2.6" opacity=".6"/>
    <!-- front seam -->
    <path d="M22 152h56" stroke-width="2.6" opacity=".45"/>
  </g>
</svg>
