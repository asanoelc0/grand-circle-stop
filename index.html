<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packing Bags</title>
<style>
  :root{
    --wall:#f4ece0; --wall-2:#e9dcca; --floor:#d8c3a5; --floor-2:#c9b091;
    --ink:#3f3228; --ink-soft:#6f6152; --card:#fffaf2; --line:#e0d2bd;
    --shadow:rgba(63,50,40,.16);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wall:#2b2622; --wall-2:#211d1a; --floor:#3a322b; --floor-2:#2d2621;
      --ink:#f3ece1; --ink-soft:#b9ac9b; --card:#332c26; --line:#4a4038;
      --shadow:rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
      --wall:#2b2622; --wall-2:#211d1a; --floor:#3a322b; --floor-2:#2d2621;
      --ink:#f3ece1; --ink-soft:#b9ac9b; --card:#332c26; --line:#4a4038;
      --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--wall) 0%,var(--wall) 46%,var(--floor) 46%,var(--floor-2) 100%);
  }
  .room{max-width:880px; margin:0 auto; padding:40px 16px 64px}
  header h1{font-size:22px; margin:0 0 6px; letter-spacing:.02em}
  header p{margin:0 0 28px; color:var(--ink-soft); font-size:14px}

  .bags{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; align-items:flex-end}
  .bag-btn{
    flex:1 1 200px; max-width:240px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:18px 12px 14px; border:2px solid transparent; border-radius:22px;
    background:transparent; color:inherit; font:inherit; cursor:pointer;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .bag-btn svg{width:132px; height:132px; filter:drop-shadow(0 10px 10px var(--shadow)); transition:transform .18s ease}
  .bag-btn:hover{background:color-mix(in srgb,var(--card) 70%,transparent)}
  .bag-btn:hover svg{transform:translateY(-6px) rotate(-2deg)}
  .bag-btn:focus-visible{outline:none; border-color:var(--ink)}
  .bag-btn[aria-expanded="true"]{background:var(--card); border-color:var(--line)}
  .bag-btn[aria-expanded="true"] svg{transform:translateY(-4px)}
  .bag-btn .label{font-size:15px; font-weight:700}
  .bag-btn .count{font-size:12px; color:var(--ink-soft)}

  .panel{
    margin:26px auto 0; max-width:520px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:18px 20px;
    box-shadow:0 14px 28px var(--shadow);
  }
  .panel[hidden]{display:none}
  .panel h2{margin:0 0 12px; font-size:16px}
  .panel ul{list-style:none; margin:0; padding:0}
  .panel li{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:14px}
  .panel li:last-child{border-bottom:none}
  .panel input{width:18px; height:18px; accent-color:#c9705d}
</style>
</head>
<body>
<div class="room">
  <header>
    <h1>今日の荷造り</h1>
    <p>バッグを押すと、その中に入れるものリストが開きます。</p>
  </header>

  <div class="bags" id="bags"></div>
  <section class="panel" id="panel" hidden aria-live="polite">
    <h2 id="panelTitle"></h2>
    <ul id="panelList"></ul>
  </section>
</div>

<script>
const BAGS = [
  { id:"suitcase", label:"キャリーケース", file:"assets/icons/suitcase.svg",
    items:["着替え 3日分","洗面用具","充電器一式","折りたたみ傘","おみやげ用スペース"] },
  { id:"backpack", label:"リュックサック", file:"assets/icons/backpack.svg",
    items:["ノートPC","モバイルバッテリー","羽織り","飲み物","本"] },
  { id:"shoulder", label:"ショルダーバッグ", file:"assets/icons/shoulder-bag.svg",
    items:["財布","パスポート","スマホ","リップ","チケット"] },
];

const bagsEl = document.getElementById("bags");
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelList = document.getElementById("panelList");
let openId = null;

Promise.all(BAGS.map(b => fetch(b.file).then(r => r.text()).catch(() => ""))).then(svgs => {
  BAGS.forEach((bag, i) => {
    const btn = document.createElement("button");
    btn.className = "bag-btn";
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = `${svgs[i]}<span class="label">${bag.label}</span><span class="count">${bag.items.length} アイテム</span>`;
    btn.addEventListener("click", () => toggle(bag, btn));
    bagsEl.appendChild(btn);
  });
});

function toggle(bag, btn){
  document.querySelectorAll(".bag-btn").forEach(b => b.setAttribute("aria-expanded","false"));
  if (openId === bag.id){ openId = null; panel.hidden = true; return; }
  openId = bag.id;
  btn.setAttribute("aria-expanded","true");
  panelTitle.textContent = `${bag.label}に入れるもの`;
  panelList.innerHTML = bag.items.map((it, i) =>
    `<li><input type="checkbox" id="${bag.id}-${i}"><label for="${bag.id}-${i}">${it}</label></li>`).join("");
  panel.hidden = false;
}
</script>
</body>
</html>
