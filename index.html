<title>Zion→Bryce 補給マップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --ground: #fbfbfa;
    --panel: #ffffff;
    --panel-2: #f2f3f1;
    --ink: #1b211e;
    --ink-2: #5c6560;
    --ink-3: #8d9691;
    --rule: #dfe2de;
    --rule-strong: #c3c8c3;
    --accent: #17663f;
    --accent-ink: #ffffff;
    --accent-soft: #e4efe8;
    --warn: #a14a16;
    --warn-ink: #ffffff;
    --warn-soft: #f7ece2;
    --info: #2f5d86;
    --info-soft: #e6edf4;
    --r1: #17663f; --r2: #2f5d86; --r3: #7a3f86; --r4: #9a6a12;
    --off: #eceeeb;
    --shield: #24302a;
    --shadow: 0 1px 2px rgba(27,33,30,.07), 0 6px 18px rgba(27,33,30,.05);
    --f-display: "Overpass", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Source Sans 3", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141816;
      --panel: #1c211f;
      --panel-2: #232927;
      --ink: #e8ebe9;
      --ink-2: #a3ada8;
      --ink-3: #737d78;
      --rule: #2e3634;
      --rule-strong: #414a47;
      --accent: #57b485;
      --accent-ink: #0d1411;
      --accent-soft: #1d3329;
      --warn: #e09257;
      --warn-ink: #221a12;
      --warn-soft: #33261a;
      --info: #8ab6dc;
      --info-soft: #1b2a37;
      --r1: #57b485; --r2: #8ab6dc; --r3: #c193cc; --r4: #d6ab54;
      --off: #262c2a;
      --shield: #e8ebe9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --ground: #141816;
    --panel: #1c211f;
    --panel-2: #232927;
    --ink: #e8ebe9;
    --ink-2: #a3ada8;
    --ink-3: #737d78;
    --rule: #2e3634;
    --rule-strong: #414a47;
    --accent: #57b485;
    --accent-ink: #0d1411;
    --accent-soft: #1d3329;
    --warn: #e09257;
    --warn-ink: #221a12;
    --warn-soft: #33261a;
    --info: #8ab6dc;
    --info-soft: #1b2a37;
    --r1: #57b485; --r2: #8ab6dc; --r3: #c193cc; --r4: #d6ab54;
    --off: #262c2a;
    --shield: #e8ebe9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

  header.masthead { padding-block: 28px 18px; border-bottom: 2px solid var(--ink); }
  .eyebrow {
    font-family: var(--f-display); font-weight: 600; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  }
  h1 {
    font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 6vw, 38px);
    line-height: 1.12; margin: 6px 0 8px; text-wrap: balance; letter-spacing: -.01em;
  }
  .sub { color: var(--ink-2); margin: 0; max-width: 60ch; }

  /* ---- route switch ---- */
  .switch-bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
    margin-inline: -16px; padding: 10px 16px;
  }
  .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 9px; flex: 0 0 auto;
    background: var(--panel); color: var(--ink); border: 1px solid var(--rule-strong);
    border-radius: 3px; padding: 7px 12px 7px 8px; cursor: pointer;
    font-family: var(--f-body); font-size: 13px; line-height: 1.25; text-align: left;
  }
  .tab:hover { border-color: var(--ink-3); }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shield {
    font-family: var(--f-display); font-weight: 800; font-size: 13px;
    width: 24px; height: 24px; display: grid; place-items: center;
    border: 2px solid var(--sc, currentColor); border-radius: 2px; flex: 0 0 auto;
  }
  .tab[aria-selected="true"] .shield { border-color: currentColor; }

  .views { display: flex; flex: 0 0 auto; border: 1px solid var(--rule-strong); border-radius: 3px; overflow: hidden; }
  .vbtn {
    background: var(--panel); color: var(--ink-2); border: 0; cursor: pointer;
    font-family: var(--f-body); font-size: 12.5px; padding: 6px 11px; white-space: nowrap;
  }
  .vbtn + .vbtn { border-left: 1px solid var(--rule-strong); }
  .vbtn[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .vbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tab-name { font-weight: 600; white-space: nowrap; }
  .tab-meta { font-size: 11px; opacity: .72; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---- summary ---- */
  .summary { margin-top: 20px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 12px; padding: 0; list-style: none; }
  .stats div { font-family: var(--f-display); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
  .stats dt, .stat-k {
    font-family: var(--f-display); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 600;
  }
  .summary p { margin: 0 0 12px; color: var(--ink-2); max-width: 62ch; }
  .warnings { background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 0 3px 3px 0; }
  .warnings > summary {
    list-style: none; cursor: pointer; padding: 8px 14px;
    font-family: var(--f-display); font-weight: 600; font-size: 12.5px;
    letter-spacing: .04em; color: var(--warn);
  }
  .warnings > summary::-webkit-details-marker { display: none; }
  .warnings > summary::after { content: " ▾"; }
  .warnings[open] > summary::after { content: " ▴"; }
  .warnings > summary:focus-visible { outline: 2px solid var(--warn); outline-offset: -2px; }
  .warnings ul { margin: 0; padding: 0 14px 12px 32px; }
  .warnings li { margin: 3px 0; font-size: 13.5px; }
  .warnings li::marker { color: var(--warn); }

  .disclosures { display: flex; flex-direction: column; gap: 8px; }
  .fees { background: var(--info-soft); border-left: 3px solid var(--info); border-radius: 0 3px 3px 0; }
  .fees > summary {
    list-style: none; cursor: pointer; padding: 8px 14px;
    font-family: var(--f-display); font-weight: 600; font-size: 12.5px;
    letter-spacing: .04em; color: var(--info);
  }
  .fees > summary::-webkit-details-marker { display: none; }
  .fees > summary::after { content: " ▾"; }
  .fees[open] > summary::after { content: " ▴"; }
  .fees > summary:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
  .fees dl { margin: 0; padding: 0 14px 12px; }
  .fees dt {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    font-family: var(--f-display); font-weight: 800; font-size: 13.5px; margin-top: 10px;
  }
  .fees dt:first-child { margin-top: 0; }
  .fees .amt { font-variant-numeric: tabular-nums; color: var(--info); }
  .fees dd { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-2); max-width: 62ch; }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 22px 0 6px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .controls label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; color: var(--ink-2); }
  .controls input { accent-color: var(--accent); width: 15px; height: 15px; }
  .legend { display: flex; gap: 12px; margin-left: auto; font-size: 11.5px; color: var(--ink-3); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; }

  /* ---- stop list ---- */
  .expand-all {
    margin-left: auto; background: none; border: 1px solid var(--rule-strong); border-radius: 3px;
    color: var(--ink-2); font-family: var(--f-body); font-size: 12.5px; padding: 4px 10px; cursor: pointer;
  }
  .expand-all:hover { border-color: var(--ink-3); color: var(--ink); }
  .expand-all:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stops { list-style: none; margin: 0; padding: 0; }
  .stop { display: grid; grid-template-columns: 58px 1fr; gap: 0 14px; position: relative; }
  .rail { position: relative; padding-top: 12px; }
  .rail::before {
    content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 2px; background: var(--rule-strong);
  }
  .stop:first-child .rail::before { top: 19px; }
  .stop:last-child .rail::before { bottom: calc(100% - 19px); }
  .mile { font-family: var(--f-display); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; padding-right: 16px; }
  .dot { position: absolute; left: 43px; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--rule-strong); border: 2px solid var(--ground); }
  .stop[data-tier="full"] .dot { background: var(--accent); width: 14px; height: 14px; left: 42px; top: 16px; }
  .stop[data-kind="junction"] .dot, .stop[data-kind="poi"] .dot { border-radius: 2px; }

  .card { border-bottom: 1px solid var(--rule); }
  .stop:last-child .card { border-bottom: none; }

  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; padding: 9px 0; cursor: pointer;
    font-family: var(--f-body); color: inherit; text-align: left;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row:hover .stop-name { color: var(--accent); }
  .stop-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; min-width: 0; flex: 1; }
  .stop-name { font-family: var(--f-display); font-weight: 800; font-size: 16px; letter-spacing: -.005em; }
  .stop-en { font-size: 11.5px; color: var(--ink-3); }
  .flag {
    font-family: var(--f-display); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 2px; background: var(--off); color: var(--ink-2);
  }
  .flag.detour { background: var(--warn-soft); color: var(--warn); }
  .flag.rec { background: var(--accent-soft); color: var(--accent); }
  .flag.pop { background: var(--info-soft); color: var(--info); }

  .chips { display: flex; gap: 3px; flex: 0 0 auto; }
  .chip {
    width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center;
    font-family: var(--f-body); font-size: 11px; font-weight: 600; line-height: 1;
  }
  .chip[data-s="yes"] { background: var(--accent); color: var(--accent-ink); }
  .chip[data-s="limited"] { background: var(--warn); color: var(--warn-ink); }
  .chip[data-s="no"], .chip[data-s="unknown"] { background: var(--off); color: var(--ink-3); }
  .chev { flex: 0 0 auto; color: var(--ink-3); font-size: 11px; width: 12px; text-align: center; }
  .row[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .detail { padding: 2px 0 16px; }
  .stop-note { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 62ch; }
  .amen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .a {
    border: 1px solid var(--rule); border-radius: 3px; padding: 8px 10px; background: var(--panel);
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .a-k { font-family: var(--f-display); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .a-v { font-family: var(--f-display); font-weight: 800; font-size: 13px; }
  .a-d { font-size: 12px; color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }
  .a[data-s="yes"] { border-left: 3px solid var(--accent); }
  .a[data-s="yes"] .a-v { color: var(--accent); }
  .a[data-s="limited"] { border-left: 3px solid var(--warn); }
  .a[data-s="limited"] .a-v { color: var(--warn); }
  .a[data-s="no"] { background: var(--off); border-left: 3px solid var(--rule-strong); }
  .a[data-s="no"] .a-v, .a[data-s="no"] .a-k { color: var(--ink-3); }

  /* ---- map ---- */
  .map-wrap { overflow-x: auto; margin-top: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .map-wrap svg { display: block; width: 100%; min-width: 640px; height: auto; }
  .map-wrap .hit { cursor: pointer; }
  .map-wrap [data-stop] { cursor: pointer; }
  .map-foot {
    display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
    margin-top: 10px; font-size: 12px; color: var(--ink-3);
  }
  .mapinfo { margin-top: 14px; }
  .mapinfo-hint { color: var(--ink-3); font-size: 13px; margin: 0; }
  .mapinfo h3 {
    font-family: var(--f-display); font-weight: 800; font-size: 17px; margin: 0 0 2px;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .mapinfo .coord { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }
  footer a { color: var(--ink-2); }
  .err { padding: 16px; border-left: 3px solid var(--warn); background: var(--warn-soft); margin-top: 24px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: var(--panel-2); padding: 1px 5px; border-radius: 2px; }

  @media (max-width: 560px) {
    header.masthead { padding-block: 16px 10px; }
    h1 { font-size: 23px; margin: 4px 0 6px; }
    .sub { display: none; }
    .summary { margin-top: 12px; }
    .stats { gap: 6px 22px; margin-bottom: 10px; }
    .stats div { font-size: 18px; }
    .stat-route { display: none; }
    .summary p { font-size: 13px; margin-bottom: 10px; }
    .controls { margin: 12px 0 4px; gap: 10px 14px; }
    .stop { grid-template-columns: 42px 1fr; gap: 0 10px; }
    .rail::before { left: 34px; }
    .dot { left: 29px; }
    .stop[data-tier="full"] .dot { left: 28px; }
    .mile { padding-right: 12px; font-size: 12px; }
    .amen { grid-template-columns: 1fr; }
    .stop-en { display: none; }
    .vbtn { padding: 6px 8px; font-size: 12px; }
    .flag { font-size: 9.5px; padding: 1px 4px; }
    .legend { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow" id="region">Grand Circle · Southern Utah</div>
    <h1 id="title">ザイオン → ブライスキャニオン</h1>
    <p class="sub" id="sub">ルートを切り替えて、途中の町の <strong>ガソリン・スーパー・ドラッグストア</strong> を確認する。</p>
  </header>

  <div class="switch-bar">
    <div class="tabs" role="tablist" aria-label="ルート選択" id="tabs"></div>
    <div class="views">
      <button type="button" class="vbtn" id="v-list" aria-pressed="true">リスト</button>
      <button type="button" class="vbtn" id="v-map" aria-pressed="false">地図</button>
    </div>
  </div>

  <section class="summary" id="summary" aria-live="polite"></section>

  <div class="controls">
    <label><input type="checkbox" id="f-full"> 3つ揃う町だけ</label>
    <label><input type="checkbox" id="f-services"> 補給できる所だけ</label>
    <div class="legend">
      <span><i class="swatch" style="background:var(--accent)"></i>あり</span>
      <span><i class="swatch" style="background:var(--warn)"></i>限定的</span>
      <span><i class="swatch" style="background:var(--rule-strong)"></i>なし</span>
    </div>
    <button type="button" class="expand-all" id="expand-all" aria-expanded="false">すべて開く</button>
  </div>

  <ul class="stops" id="stops"></ul>

  <section id="mapview" hidden>
    <div class="map-wrap" id="map-wrap"></div>
    <div class="map-foot" id="map-foot"></div>
    <div class="mapinfo" id="mapinfo"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  var LABELS = { fuel: "ガソリン", grocery: "スーパー", pharmacy: "ドラッグストア" };
  var STATUS = { yes: "あり", limited: "限定的", no: "なし", unknown: "不明" };
  var KEYS = ["fuel", "grocery", "pharmacy"];
  var SHORT = { fuel: "ガ", grocery: "ス", pharmacy: "薬" };
  var data = null, current = null;

  var params = new URLSearchParams(location.search);
  var src = params.get("data") || "data/zion-bryce.json";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function tier(stop) {
    var n = 0, lim = 0;
    KEYS.forEach(function (k) {
      var s = (stop.amenities && stop.amenities[k] && stop.amenities[k].status) || "unknown";
      if (s === "yes") n++; else if (s === "limited") lim++;
    });
    if (n === 3) return "full";
    if (n + lim === 0) return "none";
    return "partial";
  }

  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = data.routes.map(function (r) {
      return '<button class="tab" role="tab" id="tab-' + esc(r.id) + '" data-id="' + esc(r.id) + '" ' +
        'style="--sc:' + routeColor(r.id) + '" ' +
        'aria-selected="' + (r.id === current ? "true" : "false") + '" tabindex="' + (r.id === current ? "0" : "-1") + '">' +
        '<span class="shield">' + esc(r.id) + '</span>' +
        '<span><span class="tab-name">' + esc(r.nameJa || r.name) + '</span><br>' +
        '<span class="tab-meta">' + r.distance + ' mi · ' + Math.floor(r.durationMin / 60) + 'h' + String(r.durationMin % 60).padStart(2, "0") + '</span></span>' +
        '</button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () { select(b.dataset.id); });
      b.addEventListener("keydown", function (e) {
        var i = data.routes.findIndex(function (r) { return r.id === b.dataset.id; });
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          e.preventDefault();
          var next = data.routes[(i + (e.key === "ArrowRight" ? 1 : data.routes.length - 1)) % data.routes.length];
          select(next.id);
          document.getElementById("tab-" + next.id).focus();
        }
      });
    });
  }

  function route() { return data.routes.filter(function (r) { return r.id === current; })[0]; }

  function renderSummary() {
    var r = route();
    var warn = (r.warningsJa || []).map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("");
    var fees = (data.feesJa || []).filter(function (f) {
      return !f.routes || f.routes.indexOf(r.id) >= 0;
    });
    var feeHtml = fees.map(function (f) {
      return '<dt>' + esc(f.titleJa) + '<span class="amt">' + esc(f.amountJa) + '</span></dt>' +
        (f.noteJa ? '<dd>' + esc(f.noteJa) + '</dd>' : "");
    }).join("");
    document.getElementById("summary").innerHTML =
      '<ul class="stats">' +
        '<li><span class="stat-k">距離</span><div>' + r.distance + ' <span style="font-size:13px">mi</span> / ' + Math.round(r.distance * 1.609) + ' <span style="font-size:13px">km</span></div></li>' +
        '<li><span class="stat-k">所要</span><div>' + Math.floor(r.durationMin / 60) + 'h ' + String(r.durationMin % 60).padStart(2, "0") + 'm</div></li>' +
        '<li class="stat-route"><span class="stat-k">経路</span><div style="font-size:15px;font-weight:600">' + esc(r.name) + '</div></li>' +
      '</ul>' +
      '<p>' + esc(r.summaryJa) + '</p>' +
      '<div class="disclosures">' +
      (warn ? '<details class="warnings"><summary>注意・制限 ' + r.warningsJa.length + ' 件</summary><ul>' + warn + '</ul></details>' : "") +
      (feeHtml ? '<details class="fees"><summary>料金・有料道路 ' + fees.length + ' 件</summary><dl>' + feeHtml + '</dl></details>' : "") +
      '</div>';
  }

  function amenityBlock(a) {
    var s = (a && a.status) || "unknown";
    var detail = [];
    if (a && a.names && a.names.length) detail.push(a.names.join(" / "));
    if (a && a.hours) detail.push(a.hours);
    if (a && a.noteJa) detail.push(a.noteJa);
    return detail.join(" — ");
  }

  function renderStops() {
    var r = route();
    var onlyFull = document.getElementById("f-full").checked;
    var onlyServices = document.getElementById("f-services").checked;
    var n = 0;
    var rows = r.legs.map(function (leg, i) {
      var stop = data.stops[leg.stop];
      if (!stop) return "";
      var t = tier(stop);
      if (onlyFull && t !== "full") return "";
      if (onlyServices && t === "none") return "";
      var uid = r.id + "-" + leg.stop + "-" + i;
      n++;
      var flags = "";
      if (leg.detour) flags += '<span class="flag detour">寄り道 +' + leg.detourMi + 'mi</span>';
      if (leg.optional) flags += '<span class="flag">任意</span>';
      if (stop.popular) flags += '<span class="flag pop">ブログ定番</span>';
      if (stop.recommended) flags += '<span class="flag rec">補給推奨</span>';

      var chips = KEYS.map(function (k) {
        var a = (stop.amenities || {})[k] || { status: "unknown" };
        return '<span class="chip" data-s="' + esc(a.status || "unknown") + '" ' +
          'title="' + LABELS[k] + '：' + (STATUS[a.status] || STATUS.unknown) + '">' + SHORT[k] + '</span>';
      }).join("");
      var chipLabel = KEYS.map(function (k) {
        var a = (stop.amenities || {})[k] || { status: "unknown" };
        return LABELS[k] + STATUS[a.status];
      }).join("、");

      var amen = KEYS.map(function (k) {
        var a = (stop.amenities || {})[k] || { status: "unknown" };
        var d = amenityBlock(a);
        return '<div class="a" data-s="' + esc(a.status || "unknown") + '">' +
          '<span class="a-k">' + LABELS[k] + '</span>' +
          '<span class="a-v">' + (STATUS[a.status] || STATUS.unknown) + '</span>' +
          (d ? '<span class="a-d">' + esc(d) + '</span>' : "") +
          '</div>';
      }).join("");

      return '<li class="stop" data-tier="' + t + '" data-kind="' + esc(stop.kind || "town") + '">' +
        '<div class="rail"><div class="mile">' + leg.mile + '</div><span class="dot"></span></div>' +
        '<div class="card">' +
          '<button type="button" class="row" aria-expanded="false" aria-controls="d-' + uid + '">' +
            '<span class="stop-head"><span class="stop-name">' + esc(stop.nameJa || stop.name) + '</span>' +
            '<span class="stop-en">' + esc(stop.name) + '</span>' + flags + '</span>' +
            '<span class="chips" aria-label="' + esc(chipLabel) + '">' + chips + '</span>' +
            '<span class="chev" aria-hidden="true">▾</span>' +
          '</button>' +
          '<div class="detail" id="d-' + uid + '" hidden>' +
            (stop.noteJa ? '<p class="stop-note">' + esc(stop.noteJa) + '</p>' : "") +
            '<div class="amen">' + amen + '</div>' +
          '</div>' +
        '</div></li>';
    }).join("");

    var list = document.getElementById("stops");
    list.innerHTML = rows ||
      '<li style="padding:24px 0;color:var(--ink-3)">条件に合う町がありません。フィルタを外してください。</li>';
    Array.prototype.forEach.call(list.querySelectorAll(".row"), function (b) {
      b.addEventListener("click", function () { toggle(b, b.getAttribute("aria-expanded") !== "true"); });
    });
    setExpandAll(false);
    document.getElementById("expand-all").hidden = n === 0;
  }

  function toggle(btn, open) {
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    var d = document.getElementById(btn.getAttribute("aria-controls"));
    if (d) d.hidden = !open;
  }

  function setExpandAll(open) {
    var b = document.getElementById("expand-all");
    b.setAttribute("aria-expanded", open ? "true" : "false");
    b.textContent = open ? "すべて閉じる" : "すべて開く";
  }


  /* ---------- map ---------- */
  var ROUTE_VARS = ["--r1", "--r2", "--r3", "--r4"];
  var MAP = null, pickedStop = null;

  function routeColor(id) {
    var i = data.routes.findIndex(function (r) { return r.id === id; });
    return "var(" + ROUTE_VARS[(i < 0 ? 0 : i) % ROUTE_VARS.length] + ")";
  }

  // Equirectangular, with longitudes squeezed by cos(mean latitude). Over a
  // corridor this shallow it is indistinguishable from Mercator and keeps the
  // mileage per vertical unit constant, which the scale bar relies on.
  var MI_PER_DEG_LAT = 69.05;

  function buildMap() {
    var used = {};
    data.routes.forEach(function (r) { r.legs.forEach(function (l) { used[l.stop] = 1; }); });
    var pts = Object.keys(used).map(function (id) { return data.stops[id]; })
      .filter(function (s) { return s && typeof s.lat === "number" && typeof s.lon === "number"; });
    if (!pts.length) return null;
    var lat = pts.map(function (s) { return s.lat; }), lon = pts.map(function (s) { return s.lon; });
    var latMin = Math.min.apply(null, lat), latMax = Math.max.apply(null, lat);
    var lonMin = Math.min.apply(null, lon), lonMax = Math.max.apply(null, lon);
    var k = Math.cos((latMin + latMax) / 2 * Math.PI / 180);
    var W = 1000, PAD = 84;
    var scale = (W - PAD * 2) / ((lonMax - lonMin) * k);
    MAP = {
      W: W, H: (latMax - latMin) * scale + PAD * 2, scale: scale,
      x: function (lon2) { return PAD + (lon2 - lonMin) * k * scale; },
      y: function (lat2) { return PAD + (latMax - lat2) * scale; }
    };
    return MAP;
  }

  // Segments of one route. A detour leg hangs off the last on-route stop (and
  // chains to the previous detour stop when several run together), so a side
  // trip reads as a spur instead of bending the corridor through it.
  function routeSegments(r) {
    var segs = [], lastMain = null, lastAny = null;
    r.legs.forEach(function (leg) {
      var s = data.stops[leg.stop];
      if (!s || typeof s.lat !== "number") return;
      var node = { id: leg.stop, s: s };
      if (leg.detour) {
        if (lastAny) segs.push({ a: lastAny, b: node, dashed: true });
        lastAny = node;
      } else {
        if (lastMain) segs.push({ a: lastMain, b: node, dashed: false });
        lastMain = node; lastAny = node;
      }
    });
    segs.forEach(function (g) {
      g.key = g.a.id < g.b.id ? g.a.id + "|" + g.b.id : g.b.id + "|" + g.a.id;
    });
    return segs;
  }

  // Routes A, C and D share the whole US-89 trunk and differ only by their
  // resupply spurs, so a click target drawn over the trunk could not tell them
  // apart. Each route is therefore clickable on the geometry no other route
  // has; a route with none (the plain trunk) keeps its whole line.
  function hitSegments(r, all) {
    var mine = all[r.id];
    var unique = mine.filter(function (g) {
      return !data.routes.some(function (o) {
        return o.id !== r.id && all[o.id].some(function (h) { return h.key === g.key; });
      });
    });
    return unique.length ? unique : mine;
  }

  function segPath(g) {
    return "M" + MAP.x(g.a.s.lon).toFixed(1) + " " + MAP.y(g.a.s.lat).toFixed(1) +
           "L" + MAP.x(g.b.s.lon).toFixed(1) + " " + MAP.y(g.b.s.lat).toFixed(1);
  }

  function textW(t, size) {
    var w = 0;
    for (var i = 0; i < t.length; i++) w += t.charCodeAt(i) > 0x2e80 ? 1 : 0.56;
    return w * size;
  }

  function renderMap() {
    if (!MAP && !buildMap()) return;
    var svg = [], boxes = [];
    var all = {};
    data.routes.forEach(function (r) { all[r.id] = routeSegments(r); });

    function fits(b) {
      if (b.x < 4 || b.y < 4 || b.x + b.w > MAP.W - 4 || b.y + b.h > MAP.H - 4) return false;
      return !boxes.some(function (o) {
        return b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y;
      });
    }

    // lines — the selected route is drawn last so it sits on top of the others
    data.routes.slice().sort(function (a, b) {
      return (a.id === current ? 1 : 0) - (b.id === current ? 1 : 0);
    }).forEach(function (r) {
      var on = r.id === current, col = routeColor(r.id);
      all[r.id].forEach(function (g) {
        svg.push('<path d="' + segPath(g) + '" fill="none" stroke="' + col +
          '" stroke-width="' + (on ? 5 : 2) + '" stroke-linecap="round"' +
          (g.dashed ? ' stroke-dasharray="' + (on ? "9 7" : "5 5") + '"' : "") +
          ' opacity="' + (on ? 1 : 0.3) + '"/>');
      });
    });

    // click targets
    data.routes.forEach(function (r) {
      hitSegments(r, all).forEach(function (g) {
        svg.push('<path class="hit" d="' + segPath(g) + '" fill="none" stroke="transparent" ' +
          'stroke-width="24" data-route="' + esc(r.id) + '"><title>' + esc(r.nameJa || r.name) + '</title></path>');
      });
    });

    // route badges, placed on the geometry that identifies each route
    data.routes.forEach(function (r) {
      var segs = hitSegments(r, all), best = null, bl = -1;
      segs.forEach(function (g) {
        var ax = MAP.x(g.a.s.lon), ay = MAP.y(g.a.s.lat), bx = MAP.x(g.b.s.lon), by = MAP.y(g.b.s.lat);
        var len = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
        if (len > bl) { bl = len; best = [(ax + bx) / 2, (ay + by) / 2]; }
      });
      if (!best) return;
      var on = r.id === current, sz = 30;
      var b = { x: best[0] - sz / 2, y: best[1] - sz / 2, w: sz, h: sz };
      for (var t = 0; t < 8 && !fits(b); t++) { b.x += 16; b.y -= 10; }
      boxes.push(b);
      svg.push('<g class="hit" data-route="' + esc(r.id) + '">' +
        '<rect x="' + b.x.toFixed(1) + '" y="' + b.y.toFixed(1) + '" width="' + sz + '" height="' + sz +
        '" rx="3" fill="' + (on ? routeColor(r.id) : "var(--panel)") + '" stroke="' + routeColor(r.id) + '" stroke-width="2.5"/>' +
        '<text x="' + (b.x + sz / 2).toFixed(1) + '" y="' + (b.y + sz / 2 + 7).toFixed(1) + '" text-anchor="middle" ' +
        'font-size="20" font-weight="800" fill="' + (on ? "var(--ground)" : routeColor(r.id)) + '">' + esc(r.id) + '</text>' +
        '<title>' + esc(r.nameJa || r.name) + '</title></g>');
    });

    // stops of the selected route, coloured by what you can actually buy there
    var TIER_FILL = { full: "var(--accent)", partial: "var(--warn)", none: "var(--rule-strong)" };
    var sel = route();
    sel.legs.forEach(function (leg) {
      var st = data.stops[leg.stop];
      if (!st || typeof st.lat !== "number") return;
      var cx = MAP.x(st.lon), cy = MAP.y(st.lat), t = tier(st);
      var r0 = t === "full" ? 9 : 7;
      var picked = pickedStop === leg.stop;
      svg.push('<circle data-stop="' + esc(leg.stop) + '" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
        '" r="' + (picked ? r0 + 4 : r0) + '" fill="' + TIER_FILL[t] + '" stroke="var(--ground)" stroke-width="3"/>' +
        '<circle data-stop="' + esc(leg.stop) + '" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
        '" r="16" fill="transparent"><title>' + esc(st.nameJa || st.name) + '</title></circle>');

      var label = st.nameJa || st.name, fs = 19;
      var w = textW(label, fs), h = fs + 8;
      var cands = [
        { x: cx + 15, y: cy - h / 2, anchor: "start", tx: cx + 15 },
        { x: cx - 15 - w, y: cy - h / 2, anchor: "end", tx: cx - 15 },
        { x: cx - w / 2, y: cy - 17 - h, anchor: "middle", tx: cx },
        { x: cx - w / 2, y: cy + 17, anchor: "middle", tx: cx },
        { x: cx + 13, y: cy - 13 - h, anchor: "start", tx: cx + 13 },
        { x: cx + 13, y: cy + 13, anchor: "start", tx: cx + 13 },
        { x: cx - 13 - w, y: cy - 13 - h, anchor: "end", tx: cx - 13 },
        { x: cx - 13 - w, y: cy + 13, anchor: "end", tx: cx - 13 }
      ];
      for (var i = 0; i < cands.length; i++) {
        var c = cands[i], box = { x: c.x, y: c.y, w: w, h: h };
        if (!fits(box)) continue;
        boxes.push(box);
        svg.push('<text data-stop="' + esc(leg.stop) + '" x="' + c.tx.toFixed(1) + '" y="' + (c.y + fs).toFixed(1) +
          '" text-anchor="' + c.anchor + '" font-size="' + fs + '" font-weight="' + (picked ? 800 : 600) +
          '" fill="' + (picked ? "var(--ink)" : "var(--ink-2)") + '" paint-order="stroke" ' +
          'stroke="var(--ground)" stroke-width="4" stroke-linejoin="round">' + esc(label) + '</text>');
        break;
      }
    });

    // scale bar and north arrow
    var pxPerMi = MAP.scale / MI_PER_DEG_LAT;
    var miles = [5, 10, 20, 25, 50, 100].filter(function (m) { return m * pxPerMi >= 95; })[0] || 100;
    var len = miles * pxPerMi, bx = 20, by = MAP.H - 26;
    svg.push('<g fill="var(--ink-3)" stroke="var(--ink-3)">' +
      '<path d="M' + bx + ' ' + (by - 5) + 'v10M' + bx + ' ' + by + 'h' + len.toFixed(1) +
      'M' + (bx + len).toFixed(1) + ' ' + (by - 5) + 'v10" stroke-width="2"/>' +
      '<text x="' + (bx + len / 2).toFixed(1) + '" y="' + (by - 10) + '" text-anchor="middle" font-size="16" stroke="none">' +
      miles + ' mi / ' + Math.round(miles * 1.609) + ' km</text></g>');
    svg.push('<g fill="var(--ink-3)"><path d="M' + (MAP.W - 34) + ' 46 l7 18 -7 -5 -7 5 z"/>' +
      '<text x="' + (MAP.W - 34) + '" y="34" text-anchor="middle" font-size="15" font-weight="700">N</text></g>');

    document.getElementById("map-wrap").innerHTML =
      '<svg viewBox="0 0 ' + MAP.W + ' ' + Math.round(MAP.H) + '" role="img" ' +
      'aria-label="ザイオンからブライスキャニオンまでの各ルートと経由地の位置関係">' + svg.join("") + '</svg>';

    document.getElementById("map-foot").innerHTML =
      '<span>地点は実データの緯度経度。線は地点どうしを直線で結んだ模式図で、道路の形状そのものではありません。</span>' +
      '<span>破線 = 本線から外れる寄り道</span>' +
      '<span>ルートの線か記号を選ぶと切り替わります</span>';

    renderMapInfo();
  }

  function renderMapInfo() {
    var el = document.getElementById("mapinfo");
    var st = pickedStop && data.stops[pickedStop];
    if (!st) {
      el.innerHTML = '<p class="mapinfo-hint">地点の丸を選ぶと、その町の補給状況がここに出ます。'
        + '丸の色は 緑＝3つ揃う / 橙＝一部 / 灰＝補給なし。</p>';
      return;
    }
    var amen = KEYS.map(function (k) {
      var a = (st.amenities || {})[k] || { status: "unknown" };
      var d = amenityBlock(a);
      return '<div class="a" data-s="' + esc(a.status || "unknown") + '">' +
        '<span class="a-k">' + LABELS[k] + '</span>' +
        '<span class="a-v">' + (STATUS[a.status] || STATUS.unknown) + '</span>' +
        (d ? '<span class="a-d">' + esc(d) + '</span>' : "") + '</div>';
    }).join("");
    el.innerHTML = '<h3>' + esc(st.nameJa || st.name) +
      '<span class="coord">' + st.lat.toFixed(4) + ', ' + st.lon.toFixed(4) + '</span></h3>' +
      (st.noteJa ? '<p class="stop-note">' + esc(st.noteJa) + '</p>' : "") +
      '<div class="amen">' + amen + '</div>';
  }

  function setView(v) {
    var map = v === "map";
    document.getElementById("mapview").hidden = !map;
    document.getElementById("stops").hidden = map;
    document.querySelector(".controls").hidden = map;
    document.getElementById("v-map").setAttribute("aria-pressed", map ? "true" : "false");
    document.getElementById("v-list").setAttribute("aria-pressed", map ? "false" : "true");
    try { localStorage.setItem("view:" + data.id, v); } catch (e) {}
    if (map) renderMap();
  }

  function mapIsOpen() { return !document.getElementById("mapview").hidden; }

  function select(id) {
    current = id;
    try { localStorage.setItem("route:" + data.id, id); } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      var on = b.dataset.id === id;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    });
    renderSummary();
    renderStops();
    if (mapIsOpen()) renderMap();
  }

  function renderFooter() {
    var links = (data.sources || []).map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, "").split("/")[0]) + '</a>';
    }).join(" · ");
    document.getElementById("footer").innerHTML =
      'データ基準: ' + esc(data.dataAsOf || "-") + '。営業時間・店舗の有無は変わります。処方薬・特殊な食料・大量の燃料が必要な場合は、出発前に電話で確認を。' +
      '<br>冬季は UT-14 / UT-12 の路面状況を <a href="https://udottraffic.utah.gov/" target="_blank" rel="noopener">udottraffic.utah.gov</a> で必ず確認。' +
      (links ? '<br>出典: ' + links : "");
  }

  function boot(d) {
    data = d;
    document.title = (d.titleJa || d.title) + " 補給マップ";
    document.getElementById("region").textContent = d.region || "";
    document.getElementById("title").textContent = d.titleJa || d.title;
    var saved = null;
    try { saved = localStorage.getItem("route:" + d.id); } catch (e) {}
    var def = d.routes.filter(function (r) { return r.default; })[0] || d.routes[0];
    current = (saved && d.routes.some(function (r) { return r.id === saved; })) ? saved : def.id;
    renderTabs();
    renderFooter();
    document.getElementById("f-full").addEventListener("change", renderStops);
    document.getElementById("f-services").addEventListener("change", renderStops);
    document.getElementById("v-list").addEventListener("click", function () { setView("list"); });
    document.getElementById("v-map").addEventListener("click", function () { setView("map"); });
    document.getElementById("map-wrap").addEventListener("click", function (e) {
      var stopEl = e.target.closest("[data-stop]");
      if (stopEl) {
        pickedStop = pickedStop === stopEl.dataset.stop ? null : stopEl.dataset.stop;
        renderMap();
        return;
      }
      var hit = e.target.closest("[data-route]");
      if (hit && hit.dataset.route !== current) { pickedStop = null; select(hit.dataset.route); }
    });
    document.getElementById("expand-all").addEventListener("click", function () {
      var open = this.getAttribute("aria-expanded") !== "true";
      Array.prototype.forEach.call(document.querySelectorAll(".stops .row"), function (b) { toggle(b, open); });
      setExpandAll(open);
    });
    select(current);
    var view = null;
    try { view = localStorage.getItem("view:" + d.id); } catch (e) {}
    setView(view === "map" ? "map" : "list");
  }

  fetch(src)
    .then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
    .then(boot)
    .catch(function (e) {
      document.getElementById("stops").innerHTML =
        '<li class="err"><strong>データを読み込めませんでした</strong>（' + esc(e.message) + '）。' +
        'ローカルで開く場合は <code>python3 -m http.server</code> を実行して <code>http://localhost:8000/</code> を開いてください。' +
        '別のコースを見るには <code>?data=data/&lt;id&gt;.json</code> を付けます。</li>';
    });
})();
</script>
